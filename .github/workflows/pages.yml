name: Deploy ontologies

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.docs.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: docs
        uses: cgs-earth/onto-to-pages@main
        with:
          input_dir: ./src
          output_dir: ./dist
          theme: auto
